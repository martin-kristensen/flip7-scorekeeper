<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Flip 7 Scorekeeper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1310"/>
      <stop offset="100%" stop-color="#0f0b09"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff9d5a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff9d5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="290" cy="160" r="250" fill="url(#glow)"/>
  <g transform="translate(84 92) scale(0.92)">
    <rect x="0" y="0" width="392" height="242" rx="52" fill="#f7f2e9"/>
    <g transform="translate(82 22)">
      <rect x="0" y="0" width="58" height="158" rx="20" transform="rotate(-60 29 79)" fill="#4fd2e6"/>
      <rect x="28" y="-14" width="58" height="158" rx="20" transform="rotate(-42 57 65)" fill="#f76c5e"/>
      <rect x="60" y="-22" width="58" height="158" rx="20" transform="rotate(-24 89 57)" fill="#ffd86a"/>
      <rect x="96" y="-24" width="58" height="158" rx="20" transform="rotate(-10 125 55)" fill="#f8f1da"/>
    </g>
    <text x="176" y="206"
          text-anchor="middle"
          font-family="Arial Black, system-ui, sans-serif"
          font-size="168"
          font-weight="900"
