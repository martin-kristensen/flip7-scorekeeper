<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip 7 Scorekeeper | Mobile score tracker for Flip 7</title>
    <meta
      name="description"
      content="Flip 7 Scorekeeper is a mobile-first score tracker for Flip 7 tables. Track rounds, winners, game history, and player totals on flip.se."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ff9f5d" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://flip.se/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="mask-icon" href="/assets/site-icon.svg" color="#ff9f5d" />
    <meta property="og:site_name" content="Flip 7 Scorekeeper" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flip.se/" />
    <meta property="og:title" content="Flip 7 Scorekeeper" />
    <meta
      property="og:description"
      content="A mobile-first score tracker for Flip 7 tables. Track rounds, winners, and game history on flip.se."
    />
    <meta property="og:image" content="https://flip.se/assets/share-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flip 7 Scorekeeper" />
    <meta
      name="twitter:description"
      content="A mobile-first score tracker for Flip 7 tables. Track rounds, winners, and game history on flip.se."
    />
    <meta name="twitter:image" content="https://flip.se/assets/share-card.png" />
    <meta name="twitter:image:alt" content="Flip 7 Scorekeeper" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- CLARITY_SNIPPET -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Flip 7 Scorekeeper",
        "url": "https://flip.se/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "description": "A mobile-first score tracker for Flip 7 tables. Track rounds, winners, game history, and player totals."
      }
    </script>
  </head>
  <body>
    <div id="app-backdrop" class="backdrop hidden" aria-hidden="true"></div>

    <header class="app-bar">
      <a class="brand" href="#home" aria-label="Flip 7 Scorekeeper home">
        <img class="brand-logo" src="/assets/Flip7_Logo_Lrg.png" alt="" />
      </a>
      <button id="menu-button" class="icon-button" type="button" aria-label="Open menu" aria-expanded="false">
        ☰
      </button>
    </header>

    <div id="system-banner" class="system-banner hidden" role="alert" aria-live="polite"></div>
    <input
      type="file"
      accept="image/*"
      capture="environment"
      data-scan-file-capture
      class="hidden"
      aria-hidden="true"
      tabindex="-1"
    />

    <nav id="drawer" class="drawer hidden" aria-label="Primary navigation">
      <button class="drawer-link" type="button" data-route="new-game">Play new game</button>
      <button class="drawer-link" type="button" data-route="current-game">Current Game</button>
      <button class="drawer-link" type="button" data-route="existing-games">Browse games</button>
      <button class="drawer-link" type="button" data-route="stats">Stats</button>
      <button class="drawer-link" type="button" data-route="settings">Settings</button>
    </nav>

    <main class="app-shell">
      <section id="screen-home" class="screen"></section>
      <section id="screen-new-game" class="screen hidden"></section>
      <section id="screen-existing-games" class="screen hidden"></section>
      <section id="screen-current-game" class="screen hidden"></section>
      <section id="screen-stats" class="screen hidden"></section>
      <section id="screen-settings" class="screen hidden"></section>
    </main>

    <div id="game-menu" class="menu-popover hidden" role="menu" aria-hidden="true"></div>

    <section id="round-confirm-modal" class="modal hidden" aria-live="polite" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-panel">
        <p class="eyebrow">Flip 7</p>
        <h2 id="round-confirm-title">Continue to the next round?</h2>
        <p id="round-confirm-message" class="muted"></p>
        <div class="modal-actions">
          <button id="round-confirm-continue" type="button">Continue to next round</button>
          <button id="round-confirm-cancel" class="button-secondary" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <section id="archive-confirm-modal" class="modal hidden" aria-live="polite" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-panel">
        <p class="eyebrow">Flip 7</p>
        <h2 id="archive-confirm-title">Tuck away this game?</h2>
        <p id="archive-confirm-message" class="muted"></p>
        <div class="modal-actions">
          <button id="archive-confirm-continue" type="button">Tuck away</button>
          <button id="archive-confirm-cancel" class="button-secondary" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <section id="flip7-award-modal" class="modal hidden" aria-live="polite" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-panel">
        <p class="eyebrow">Flip 7</p>
        <h2 id="flip7-award-title">Flip 7 bonus</h2>
        <p id="flip7-award-message" class="muted"></p>
        <div id="flip7-award-body"></div>
      </div>
    </section>

    <section id="celebration" class="celebration hidden" aria-live="assertive" aria-hidden="true">
      <canvas id="celebration-canvas" class="celebration-canvas" aria-hidden="true"></canvas>
      <div class="celebration-panel">
        <p class="eyebrow">Flip 7</p>
        <h2 id="celebration-title">Winner!</h2>
        <p id="celebration-name" class="celebration-name"></p>
        <div id="celebration-actions" class="celebration-actions hidden">
          <button id="celebration-sudden-death" class="primary-action" type="button">Sudden death</button>
          <button id="celebration-keep-tied" class="button-secondary" type="button">Keep tied result</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="/vendor/i18next.min.js" defer></script>
    <script src="/scan-image-utils.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
