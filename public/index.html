<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip 7 Scorekeeper</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app-backdrop" class="backdrop hidden" aria-hidden="true"></div>

    <header class="app-bar">
      <a class="brand" href="#home" aria-label="Flip 7 Scorekeeper home">
        <img class="brand-logo" src="/assets/Flip7_Logo_Lrg.png" alt="" />
      </a>
      <button id="menu-button" class="icon-button" type="button" aria-label="Open menu" aria-expanded="false">
        ☰
      </button>
    </header>

    <nav id="drawer" class="drawer hidden" aria-label="Primary navigation">
      <button class="drawer-link" type="button" data-route="home">Home</button>
      <button class="drawer-link" type="button" data-route="current-game">Current Game</button>
      <button class="drawer-link" type="button" data-route="stats">Stats</button>
      <button class="drawer-link" type="button" data-route="settings">Settings</button>
    </nav>

    <main class="app-shell">
      <section id="screen-home" class="screen"></section>
      <section id="screen-new-game" class="screen hidden"></section>
      <section id="screen-existing-games" class="screen hidden"></section>
      <section id="screen-current-game" class="screen hidden"></section>
      <section id="screen-stats" class="screen hidden"></section>
      <section id="screen-settings" class="screen hidden"></section>
    </main>

    <div id="game-menu" class="menu-popover hidden" role="menu" aria-hidden="true"></div>

    <section id="round-confirm-modal" class="modal hidden" aria-live="polite" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-panel">
        <p class="eyebrow">Flip 7</p>
        <h2 id="round-confirm-title">Continue to the next round?</h2>
        <p id="round-confirm-message" class="muted"></p>
        <div class="modal-actions">
          <button id="round-confirm-continue" type="button">Continue to next round</button>
          <button id="round-confirm-cancel" class="button-secondary" type="button">Cancel</button>
        </div>
      </div>
    </section>

    <section id="celebration" class="celebration hidden" aria-live="assertive" aria-hidden="true">
      <canvas id="celebration-canvas" class="celebration-canvas" aria-hidden="true"></canvas>
      <div class="celebration-panel">
        <p class="eyebrow">Flip 7</p>
        <h2 id="celebration-title">Winner!</h2>
        <p id="celebration-name" class="celebration-name"></p>
      </div>
    </section>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
